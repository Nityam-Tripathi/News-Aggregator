name: Phase 2 migration checks
on:
  push:
    branches: [phase-2-database]
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: phase2_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/phase2_test
      ALLOW_PHASE2_MIGRATIONS: "yes"
      PYTHONPATH: "."
    defaults:
      run:
        working-directory: GenAI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: alembic upgrade 0001_baseline
      - run: python tests/phase2_migration_check.py seed
      - run: alembic upgrade head
      - run: python tests/phase2_migration_check.py verify
      - run: python -c "from app.database import engine; from sqlalchemy import text; c=engine.connect(); assert c.execute(text('SELECT count(*) FROM articles WHERE search_document IS NOT NULL')).scalar() == 5; c.close()"
      - run: alembic current
      - run: alembic downgrade 0001_baseline
      - run: python tests/phase2_migration_check.py verify-baseline
      - run: alembic upgrade head
      - run: python tests/phase2_migration_check.py verify
      - run: python -m unittest discover -s tests -v
      - run: python tests/phase2_hnsw_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: hnsw-report
          path: GenAI/hnsw-report.json
          if-no-files-found: error
      - run: python tests/phase2_news_evaluation.py
      - uses: actions/upload-artifact@v4
        with:
          name: news-retrieval-report
          path: GenAI/news-retrieval-report.json
          if-no-files-found: error
